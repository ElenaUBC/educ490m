  const Q=[[`How many slices will each guest have?`,Math.floor(total/PEOPLE)],[`How many extra pieces do you have that will be left over?`,total%PEOPLE],[`How much money will all of the pizzas together cost?`,cost],[`You already paid $${paid}. How much more do you have to pay?`,cost-paid]][n];
  prompt(fb,'keeper',Q[0],{silent:true});
  const cd=el('div','card tape',`<div style="display:flex;gap:18px;align-items:flex-start"><div style="flex:1"><div style="font-size:15px;color:var(--soft)">Question ${n+1} of ${nQ}</div><div style="font-size:26px;margin-top:2px">${Q[0]}</div></div><div style="text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px"><div style="display:flex;gap:8px;align-items:center">${n>=2?'<b style="font-size:30px">$</b>':''}<input class="answer" id="ans" inputmode="numeric" autocomplete="off"><button class="btn green" id="ok">OK</button></div><button class="btn yellow" id="qHint">Hint</button><div id="qmsg" style="min-height:24px;font-size:19px;color:#c0705a;max-width:300px"></div></div></div>`,'left:70px;top:130px;width:1010px;z-index:5'); fb.appendChild(cd);
  const low=el('div','card','',`left:70px;top:${n<2?330:300}px;width:1010px`); fb.appendChild(low);
  const loon=(k,o='')=>`<div style="display:flex;flex-wrap:wrap;gap:1px;justify-content:center;margin-top:4px">${Array.from({length:k},(_,j)=>`<span style="${o&&j<o.n?o.css:''}">${coinArt('loonie',28)}</span>`).join('')}</div>`;
  const draw=()=>{ if(n<2) low.innerHTML=shown?`<h3>Slices for everyone</h3>${sliceGrid()}`:`<h3>Our pizzas <span style="font-size:17px;color:var(--soft)">(each pizza has 8 slices)</span></h3><div style="display:flex;flex-wrap:wrap;gap:8px">${L.map(i=>pizzaArt(PIZZAS[i].top,80)).join('')}</div><h3 style="margin-top:10px">${PEOPLE} guests</h3>${guestRow(40)}`;
    else if(n===2) low.innerHTML=`<h3>Our pizzas</h3><div style="display:flex;flex-wrap:wrap;gap:14px">${L.map(i=>`<div style="text-align:center;width:100px">${pizzaArt(PIZZAS[i].top,92)}<div style="font-size:26px;font-weight:700">$${PIZZAS[i].price}</div>${shown?loon(PIZZAS[i].price):''}</div>`).join('')}</div>`;
    else low.innerHTML=`<h3>All of our pizzas cost $${cost}</h3><div style="font-size:22px">You already paid <b>$${paid}</b>.</div>${shown?`<div style="font-size:18px;color:var(--soft);margin-top:6px">Each loonie is one dollar. The grey loonies are already paid. Count the others!</div>${loon(cost,{n:paid,css:'opacity:.25;filter:grayscale(1)'})}`:''}`; };
  const hint=$('#qHint');
  const doHint=()=>{ if(shown) return; shown=true; hint.remove(); draw(); };
  hint.onclick=()=>{ click(); doHint(); }; SC.help=doHint; draw();
  const inp=$('#ans'); setTimeout(()=>inp.focus({preventScroll:true}),50);
  const check=async()=>{ const v=parseInt(inp.value.replace(/[^0-9]/g,''),10); if(isNaN(v)) return;
    if(v===Q[1]){ chime(); sparkle(inp); const tok=SC.tok;
      if(n<nQ-1){ go(()=>pizQ(n+1)); return; }
      const due=cost-paid;
      if(due*100>state.walletCents){ oops(); prompt(fb,'keeper','Oops! That costs more money than you have. Go back and take some pizza away.'); return; }
      stepBackVisible(false); cd.remove(); confetti(); await toast('Well done!',1600); if(!alive(tok)) return; await payWithCoins(due*100,$('#exitBtn')); if(!alive(tok)) return;
      S.counts.forEach((c,i)=>{ for(let k=S.bought[i];k<c;k++) addInv('Pizza',PIZZAS[i].n.toLowerCase()+' pizza','pizza'); });
      S.bought=S.counts.slice(); S.paid=cost; state.pizzaSlices=total; completeStation('pizza'); }
    else { oops(); cd.classList.remove('shake'); void cd.offsetWidth; cd.classList.add('shake'); $('#qmsg').textContent='Are you sure? Can you double check?'; inp.value=''; inp.focus({preventScroll:true}); } };
  $('#ok').onclick=()=>{ click(); check(); }; inp.onkeydown=e=>{ if(e.key==='Enter') check(); }; }

/* ---------- GIFT SHOP (teammate's station; no prices) ---------- */
const GIFTS=['soccer ball','backpack','board game','teddy bear','art set','mermaid doll'];
const PAPERS=[['pWaves','waves'],['pStars','stars'],['pStripes','stripes']], BOWS=[['#5fb3b3','teal'],['#e2574c','red'],['#f2d27a','yellow']];
function giftShop(){ const S=state.st.gift, fb=FB(); const R=room();
  if(state.gift){ prompt(fb,'keeper','Hello again! You already have a lovely gift for Mia.',{actor:R.keeper}); lock(); return; }
  talk(fb,[{who:'keeper',text:'Hello! Welcome to the gift shop.'},{who:'player',text:'Hi! I want to get a birthday present for Mia.'},{who:'keeper',text:'Please choose a gift for your friend.'}],{actors:R,onBack:back}).then(()=>go(giftChoose)); }
function giftChoose(){ const fb=FB(), R=room({px:20}), S=state.st.gift;
  prompt(fb,'keeper','Which gift would Mia like?',{actor:R.keeper});
  const shelf=el('div','card tape','','left:200px;top:150px;width:640px;height:540px;background:#f3e7d2'); fb.appendChild(shelf);
  [0,1].forEach(r=>shelf.insertAdjacentHTML('beforeend',`<div style="position:absolute;left:10px;right:10px;top:${236+r*250}px;height:14px;background:#b98656;border:2px solid var(--ink);border-radius:4px"></div>`));
  GIFTS.forEach((g,i)=>{ const t=el('div','tile',`${icon(g,140)}<div style="font-size:20px;font-weight:700">${g}</div>`,`position:absolute;left:${20+(i%3)*205}px;top:${20+Math.floor(i/3)*250}px;width:190px`); t.onmouseenter=()=>speak(g);
    t.onclick=()=>{ click(); S.gift=g; go(giftWrap); }; shelf.appendChild(t); }); }
function giftWrap(){ const fb=FB(), R=room({px:20}), S=state.st.gift;
  prompt(fb,'keeper','Nice choice! Please select your bow and gift wrap.',{actor:R.keeper});
  const cd=el('div','card tape','','left:180px;top:150px;width:700px;height:540px'); fb.appendChild(cd);
  const draw=()=>{ cd.innerHTML=`<div style="display:flex;gap:20px"><div style="flex:1"><h3>Gift wrap</h3><div style="display:flex;gap:12px">${PAPERS.map(([id,n])=>`<div class="tile ${S.paper===id?'sel':''}" data-paper="${id}"><svg width="110" height="84" viewBox="0 0 110 84"><g filter="url(#pb)">${rc(4,4,102,76,6,`url(#${id})`)}</g></svg><div style="font-size:18px">${n}</div></div>`).join('')}</div>
     <h3 style="margin-top:16px">Bow</h3><div style="display:flex;gap:12px">${BOWS.map(([col,n])=>`<div class="tile ${S.bow===col?'sel':''}" data-bow="${col}"><svg width="110" height="70" viewBox="0 0 110 70"><g filter="url(#pb)"><path d="M55 35 C30 0 6 20 30 40 C10 50 20 66 40 54 L55 35Z M55 35 C80 0 104 20 80 40 C100 50 90 66 70 54 L55 35Z" fill="${col}" ${ST}/>${c(55,35,9,col)}</g></svg><div style="font-size:18px">${n}</div></div>`).join('')}</div></div>
     <div style="width:220px;text-align:center"><h3>${S.gift}</h3>${S.paper?wrapArt(S.bow?3:1,S.paper,S.bow||'#5fb3b3',200):icon(S.gift,180)}<div style="margin-top:10px"><button class="btn green" id="wrapNext" ${S.paper&&S.bow?'':'disabled'}>Next ${ICO.right}</button></div></div></div>`;
    cd.querySelectorAll('[data-paper]').forEach(t=>t.onclick=()=>{ click(); S.paper=t.dataset.paper; draw(); });
    cd.querySelectorAll('[data-bow]').forEach(t=>t.onclick=()=>{ click(); S.bow=t.dataset.bow; draw(); });
    $('#wrapNext').onclick=()=>{ click(); go(giftSeq); }; };
  draw(); }
function giftSeq(){ const fb=FB(), R=room({px:20}), S=state.st.gift; const steps=['Put the gift in a box','Wrap the box in paper','Tape the paper','Add the bow']; let placed=0;
  const start=()=>{ prompt(fb,'keeper','Put the pictures in order: first, next, then, last. Click a picture, or drag it.',{actor:R.keeper});
    const top=el('div','card tape','','left:150px;top:160px;width:860px;height:250px'); fb.appendChild(top);
    const slots=['FIRST','NEXT','THEN','LAST'].map((w,i)=>{ const s=el('div','',`<div class="hold" style="width:180px;height:180px;border:3px dashed var(--ink);border-radius:16px;display:flex;align-items:center;justify-content:center"></div><b style="font-size:22px">${i+1}. ${w}</b>`,`position:absolute;left:${16+i*210}px;top:14px;text-align:center`); s.dataset.drop='step'; s.dataset.i=i; top.appendChild(s); return s; });
    const pics=el('div','','','position:absolute;left:150px;top:440px;width:860px;display:flex;gap:30px;justify-content:center'); fb.appendChild(pics);
    const put=(card,i,slot)=>{ if(+slot.dataset.i===i&&i===placed){ slot.querySelector('.hold').appendChild(card); card.style.pointerEvents='none'; card.style.border='none'; card.style.boxShadow='none'; placed++; tone(700+placed*120,.12,.05,'triangle'); sparkle(slot);
        if(placed===4){ chime(); setActor(R.keeper,'cheer'); const tok=SC.tok; setTimeout(()=>{ if(!alive(tok)) return; (()=>{
          const pn=PAPERS.find(x=>x[0]===S.paper)[1], bn=BOWS.find(x=>x[0]===S.bow)[1];
          point('gift',S.gift==='mermaid doll',S.gift); point('gift',pn==='waves','wavy gift wrap'); point('gift',bn==='teal','teal bow');
          state.gift={name:S.gift,paper:S.paper,bow:S.bow}; addInv('Gift',`${S.gift} (wrapped in ${pn} paper with a ${bn} bow)`,'giftbox'); happyEnd('gift',R,'Here is your gift for Mia. She is going to love it!'); })(); },900); } }
      else { oops(); card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake'); prompt(fb,'keeper',['What do we do first, before wrapping?','What comes next, after the gift is in the box?','What do we do after wrapping the box?','What is the last thing we add?'][placed],{actor:R.keeper}); } };
    [0,1,2,3].sort(()=>Math.random()-.5).forEach(i=>{ const card=el('div','card tile',`${wrapArt(i,S.paper,S.bow,130)}<div style="font-size:15px;max-width:150px;text-align:center">${steps[i]}</div>`,'position:relative;width:180px;padding:6px');
      makeDraggable(card,drop=>{ if(drop&&drop.dataset.drop==='step') put(card,i,drop); },()=>{ click(); put(card,i,slots[placed]); }); pics.appendChild(card); }); };
  talk(fb,[{who:'keeper',text:"Let's wrap your gift! Put the pictures in the right order."}],{actors:R,onBack:back}).then(start); }

/* ================= PARTY ROOM ================= */
async function confirmParty(){ const i=await modal(`<div style="font-family:Fredoka,Andika;font-size:30px;margin-bottom:6px">Are you ready for the party?</div><div style="text-align:left;display:inline-block">${checklistHTML()}</div><div style="font-size:19px;color:var(--soft);margin-top:6px">After the party starts, you can't go back to the shops.</div>`,[{label:'Not yet',cls:'red',icon:ICO.left},{label:"Yes, let's party!",cls:'green',icon:ICO.check}]);
  if(i===1) goParty(); }
function partyDecor(theme){ if(!theme) return '';
  const cols=THEMES[theme].map(x=>x[0]);
  if(theme==='Mermaid') return `<path d="M0 470 q30 -24 60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 V512 H0Z" fill="#9fd3d6" ${ST}/>${[[80,200],[150,300],[1010,220],[1080,330],[960,140],[200,150]].map(([x,y])=>c(x,y,10,'#fff','stroke-width="1.8"')+c(x+16,y-22,6,'#fff','stroke-width="1.5"')).join('')}${[[90,250,'#f4b3c2'],[1070,260,'#f6e3a6'],[300,300,'#f6e3a6'],[870,300,'#f4b3c2']].map(([x,y,col])=>`<path d="M${x-22} ${y+10} Q${x} ${y-30} ${x+22} ${y+10} Q${x} ${y+18} ${x-22} ${y+10}Z" fill="${col}" ${ST}/>${[-12,-4,4,12].map(d=>ln(`M${x} ${y+12} L${x+d*1.4} ${y-14}`,1.4,.6)).join('')}`).join('')}${[[200,380],[980,380]].map(([x,y])=>`<path d="M${x} ${y-22} L${x+6} ${y-6} L${x+22} ${y-4} L${x+9} ${y+6} L${x+14} ${y+22} L${x} ${y+12} L${x-14} ${y+22} L${x-9} ${y+6} L${x-22} ${y-4} L${x-6} ${y-6}Z" fill="#f0a868" ${ST}/>`).join('')}`;
  if(theme==='Pirate') return `<g transform="translate(90 300)">${c(0,0,46,'none','stroke-width="6" stroke="#8a5a2f"')}${c(0,0,12,'#8a5a2f')}${[0,45,90,135].map(a=>ln(`M${-60*Math.cos(a*Math.PI/180)} ${-60*Math.sin(a*Math.PI/180)} L${60*Math.cos(a*Math.PI/180)} ${60*Math.sin(a*Math.PI/180)}`,6)).join('')}</g><g transform="translate(990 410)">${rc(0,20,120,80,6,'#a5642e')}<path d="M0 30 Q60 -30 120 30Z" fill="#8a5a2f" ${ST}/>${rc(52,40,16,20,3,'#e3bd59')}${[10,30,90,105].map(x=>c(x,22,8,'#e3bd59','stroke-width="1.6"')).join('')}</g>`;
  if(theme==='Dinosaurs') return `${[60,1100].map(x=>`<path d="M${x} 512 C${x-4} 440 ${x+8} 400 ${x+4} 350 M${x+4} 350 q-40 -12 -56 12 M${x+4} 350 q40 -20 60 4 M${x+4} 350 q-20 -40 -50 -36 M${x+4} 350 q20 -40 54 -32" fill="none" stroke="#5f9a52" stroke-width="10" stroke-linecap="round"/>`).join('')}<g transform="translate(120 300) scale(.9)"><path d="M50 108 C46 84 66 70 96 72 C110 72 118 64 122 44 C124 34 136 30 142 38 C146 44 140 48 134 48 C128 66 130 80 140 92 C150 104 168 104 182 98 C168 112 140 116 120 112 L122 124 H112 L108 112 H80 L80 124 H70 L68 108Z" fill="#e39b5b" ${ST}/></g>`;
  return ''; }
function garlandArt(theme){ const cols=THEMES[theme].map(x=>x[0]); let s=`<path d="M0 60 Q582 160 1164 60" fill="none" ${ST}/>`; for(let i=0;i<15;i++){ const t=(i+.5)/15, x=t*1164, y=60+Math.sin(t*Math.PI)*100-30; s+=balloonArt(cols[i%3],x,y,1); } return s; }
async function goParty(){ if(state.partyStarted) return; state.partyStarted=true; newScreen(); closePanel(); closeStationNow(); clearInterval(state.timerId); document.querySelectorAll('.modal').forEach(m=>m.remove()); show('#s-party');
  const P=$('#s-party'), theme=state.decorations, sup=state.st.supplies||{};
  const bakery=(state.inventory['Bakery']||[]).map(i=>i.icon), groc=[...new Set((state.inventory['Groceries']||[]).map(i=>i.icon))], pizzas=(state.inventory['Pizza']||[]).length;
  const hasCake=bakery.includes('cake'); const others=[...new Set(bakery.filter(k=>k!=='cake'))];
  const food=[...others.slice(0,3),...(pizzas?['pizza']:[]),...groc.slice(0,6)];
  const guestsCame=!!state.done.post, kit=!!sup.kit;
  const inner=interiorInner('party'); P.innerHTML=''; paintBG(P,inner.slice(0,-4)+`${partyDecor(theme)}${theme?garlandArt(theme):signBoard(582,160,320,60,'Happy Birthday','#fffdf6',36)}</g>`);
  const tableY=470;
  P.insertAdjacentHTML('beforeend',`<div class="npc" id="partyMia" style="left:150px;top:335px">${charSVG(COL.mia,{h:200,hat:'party'})}</div>`);
  P.insertAdjacentHTML('beforeend',`<div class="npc" style="left:300px;top:${tableY-90}px;width:560px;height:200px"><svg width="560" height="200" viewBox="0 0 560 200" style="position:absolute;left:0;top:0"><rect x="22" y="88" width="516" height="74" fill="${theme?THEMES[theme][2][0]:'#f4b3c2'}"/><g filter="url(#pbU)">${rc(20,86,520,30,8,'#fffdf6')}<path d="M20 100 H540 V170 Q500 150 460 170 T380 170 T300 170 T220 170 T140 170 T60 170 Q40 160 20 170Z" fill="${theme?THEMES[theme][2][0]:'#f4b3c2'}" ${ST}/>${rc(60,160,14,40,3,'#9a7552')}${rc(486,160,14,40,3,'#9a7552')}</g></svg>
    <div style="position:absolute;left:0;right:0;top:${hasCake?-14:30}px;display:flex;justify-content:center;align-items:flex-end;gap:0">${food.slice(0,Math.ceil(food.length/2)).map(k=>icon(k,60)).join('')}${hasCake?icon('cake',120):''}${food.slice(Math.ceil(food.length/2)).map(k=>icon(k,60)).join('')}</div></div>`);
  if(state.gift) P.insertAdjacentHTML('beforeend',`<div class="npc" style="left:880px;top:420px">${wrapArt(3,state.gift.paper,state.gift.bow,110)}</div>`);
  const people=[[COL.player,{}],...(guestsCame?GUESTS.map(g=>[COL.guests[g],{}]):[])];
  const spots=[[40,470],[150,540],[880,520],[990,470],[250,580],[760,590],[60,610],[1040,610],[420,620]];
  people.forEach(([c,o],i)=>{ const [x,y]=spots[i]; P.insertAdjacentHTML('beforeend',`<div class="npc" style="left:${x}px;top:${y}px"><div class="dance" style="animation-delay:${i*.13}s">${charSVG(c,{h:130,hat:kit?'party':null,cls:'cheer'})}</div></div>`); });
  const mia=$('#partyMia'); confetti(); chime();
  const lines=[], say=t=>lines.push({who:'mia',text:t});
  /* 1. invitations */
  if(guestsCame) say('Yay, all my friends came! Thank you for mailing the invitations.');
  else say("Oh no, where are my friends? They never got their invitations... But I'm so glad that you came to my birthday!");
  /* 2. decorations */
  const themeWord={Mermaid:'mermaid',Pirate:'pirate',Dinosaurs:'dinosaur'};
  if(!theme) say('The room looks a little empty without decorations.');
  else if(theme==='Mermaid') say("I love the decorations! They're exactly what I dreamt of.");
  else say(`I love the decorations, and how creative you were! I thought I would see a mermaid party, but you picked the ${themeWord[theme]||theme.toLowerCase()} theme.`);
  /* 3. food: cake, pizza, drinks and snacks */
  const DRINKS=['juice boxes','water bottles','apple juice','grape juice','lemonade','milk'];
  const drinks=groc.some(k=>DRINKS.includes(k)), snacks=groc.some(k=>!DRINKS.includes(k))||others.length>0;
  const slices=pizzas?state.pizzaSlices:0, enoughPizza=pizzas&&slices>=PEOPLE*2;
  if(!hasCake&&!pizzas&&!snacks) say('Oh, I wish there was something to eat at my party.');
  else if(hasCake&&enoughPizza&&drinks&&snacks) say('The food was great! Thank you for picking all of it.');
  else {
    if(hasCake) say('Thank you for the birthday cake, I loved it!');
    else say(`Thanks for the ${pizzas?'food':'snacks'}! I wish we had a birthday cake, but my guests had something to eat, so thank you.`);
    if(pizzas&&!enoughPizza) say(slices<PEOPLE?"I wish there was more pizza. Some guests didn't get any.":'I wish there was more pizza. Some guests only had 1 slice.');
    if(!pizzas&&snacks) say('I wish there was something to eat other than snacks.');
    if(snacks&&!drinks) say('I wish there were some drinks, because my guests were thirsty.');
  }
  /* 4. gift (optional, only mentioned if there is one) */
  if(state.gift) say(`A present for me? Let me open it... a ${state.gift.name}! Thank you, and it's wrapped so nicely!`);
  /* 5. last */
  say('Thank you for all the work you have done for my party!');
  await wait(700); await talk(P,lines,{actors:{mia}});
  mia.firstElementChild.classList.add('dance'); setActor(mia,'cheer');
  const done=CHECK.filter(([, ,f])=>f()).length;
  const rep=el('div','card tape',`<h3 style="text-align:center;font-size:30px">Mia's list</h3>${checklistHTML()}<div style="text-align:center;margin-top:12px"><button class="btn green big" id="again">Play again</button></div>`,'left:340px;top:60px;width:480px;z-index:50');
  P.appendChild(rep); $('#again').onclick=()=>location.reload(); }

/* ---------- start ---------- */
updateWallet(); titleScreen(); stepBackVisible(false);

</script>
